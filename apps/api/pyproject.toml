[project]
name = "vetcare-api"
version = "0.1.0"
description = "API de la plataforma de gestión veterinaria"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.2",
    "asyncmy>=0.2.10,<0.3",
    # Requerido por asyncmy para la autenticación caching_sha2_password de MySQL 8.
    "cryptography>=44",
    "alembic>=1.14,<2.0",
    "pyjwt>=2.10,<3.0",
    "argon2-cffi>=23.1,<26.0",
    # Base de zonas horarias para zoneinfo en sistemas que no la traen (p. ej. Windows).
    "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "httpx>=0.27,<1.0",
    "coverage[toml]>=7.6,<8.0",
    "ruff>=0.17,<0.18",
    "mypy>=2.0,<3.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "RUF", "ASYNC", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["vetcare"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["vetcare"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
