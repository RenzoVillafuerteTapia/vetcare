name: Contratos

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detectar cambios en la API o los contratos
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Comparar archivos modificados
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="origin/$BASE_REF"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "contracts=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            base="$BEFORE"
          fi
          pattern='^(apps/api/|packages/shared/|package(-lock)?\.json$|\.github/workflows/contracts\.yml$)'
          if git diff --name-only "$base...HEAD" | grep -qE "$pattern"; then
            echo "contracts=true" >> "$GITHUB_OUTPUT"
          else
            echo "contracts=false" >> "$GITHUB_OUTPUT"
          fi

  # Check requerido. Si no cambió nada relevante queda "skipped", y GitHub lo cuenta como aprobado.
  contracts:
    name: contracts
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: |
          pip install -e apps/api
          npm ci
      - name: Exportar el contrato desde el código de la API
        run: python -m vetcare.cli export-openapi packages/shared/openapi.json
      - name: Generar los tipos TypeScript
        run: npm run contracts:generate
      - name: El contrato y los tipos versionados están al día
        run: |
          if ! git diff --exit-code -- packages/shared; then
            echo "::error::El contrato cambió. Ejecuta 'bash scripts/update-contracts.sh' y commitea packages/shared."
            exit 1
          fi
      - name: Tipos y pruebas del paquete compartido
        run: npm run contracts:check
